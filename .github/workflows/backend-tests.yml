# Pytest run for the admin backend.
#
# Scope: `backend/` (the agents proxy, ops CI triggers and the rest of
# backend/test_*.py). Runs on every PR + push to main that touches the
# backend. Path-filtered so frontend-only PRs don't spin up a Python
# runtime for nothing. The tests need no network, cloud credentials or
# cluster access.

name: backend · tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: install deps
        run: pip install -r requirements.txt pytest==9.2.0
      - name: run pytest
        run: python -m pytest -q
